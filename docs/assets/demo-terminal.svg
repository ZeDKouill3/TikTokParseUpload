    @keyframes l12 { 0%,41.8% {opacity:0;} 42.3% {opacity:1;} 95% {opacity:1;} 100% {opacity:0;} }
    @keyframes l13 { 0%,45.2% {opacity:0;} 45.7% {opacity:1;} 95% {opacity:1;} 100% {opacity:0;} }
