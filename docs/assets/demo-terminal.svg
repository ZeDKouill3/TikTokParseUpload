<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 490" font-family="'Cascadia Code', 'Consolas', 'SFMono-Regular', Menlo, monospace">
  <title>Rejeu d'une vraie session : python -m clipper -v run &lt;url&gt;, des 12 étapes au clip prêt</title>
  <style>
    .win { fill: #0d1117; }
    .bar { fill: #161b22; }
    .dot-r { fill: #ff5f56; }
    .dot-y { fill: #ffbd2e; }
    .dot-g { fill: #27c93f; }
    .bar-title { fill: #8b949e; font-size: 12px; }
    .line { font-size: 13.5px; opacity: 0; }
    .prompt { fill: #58a6ff; }
    .log { fill: #8b949e; }
    .ok { fill: #3fb950; }
    .done { fill: #e6edf3; font-weight: 700; }
    .line { animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: linear; }
  </style>

  <rect class="win" x="0" y="0" width="860" height="490" rx="10"/>
  <rect class="bar" x="0" y="0" width="860" height="34" rx="10"/>
  <rect class="bar" x="0" y="18" width="860" height="16"/>
  <circle class="dot-r" cx="20" cy="17" r="6"/>
  <circle class="dot-y" cx="40" cy="17" r="6"/>
  <circle class="dot-g" cx="60" cy="17" r="6"/>
  <text x="430" y="21" text-anchor="middle" class="bar-title">clipper — python -m clipper -v run</text>

  <text x="24" y="58" class="line prompt" style="animation-name: l0; opacity: 1;">$ python -m clipper -v run https://www.youtube.com/watch?v=DEMOID00001</text>
  <text x="24" y="76.5" class="line log" style="animation-name: l1;">10:11:18 INFO DEMOID00001 : etape download</text>
  <text x="24" y="95" class="line log" style="animation-name: l2;">10:11:18 INFO DEMOID00001 : etape transcribe</text>
  <text x="24" y="113.5" class="line log" style="animation-name: l3;">10:11:18 INFO DEMOID00001 : etape scenes</text>
  <text x="24" y="132" class="line log" style="animation-name: l4;">10:11:18 INFO DEMOID00001 : etape audio</text>
  <text x="24" y="150.5" class="line log" style="animation-name: l5;">10:11:18 INFO DEMOID00001 : etape moments</text>
  <text x="24" y="169" class="line ok" style="animation-name: l6;">  [moments] terminée en 281.4 s (+ jury : retention/monteur/avocat/spectateur/conformité)</text>
  <text x="24" y="187.5" class="line log" style="animation-name: l7;">10:15:59 INFO DEMOID00001 : etape vision</text>
  <text x="24" y="206" class="line ok" style="animation-name: l8;">  [vision] terminée en 121.4 s</text>
  <text x="24" y="224.5" class="line log" style="animation-name: l9;">10:18:01 INFO DEMOID00001 : etape parts</text>
  <text x="24" y="243" class="line ok" style="animation-name: l10;">  [parts] terminée en 0.2 s</text>
  <text x="24" y="261.5" class="line log" style="animation-name: l11;">10:18:01 INFO DEMOID00001 : etape captions</text>
  <text x="24" y="280" class="line ok" style="animation-name: l12;">  [captions] terminée en 27.5 s</text>
  <text x="24" y="298.5" class="line log" style="animation-name: l13;">10:18:28 INFO DEMOID00001 : etape reframe</text>
  <text x="24" y="317" class="line ok" style="animation-name: l14;">  [reframe] terminée en 2.7 s</text>
  <text x="24" y="335.5" class="line log" style="animation-name: l15;">10:18:31 INFO DEMOID00001 : etape subtitles</text>
  <text x="24" y="354" class="line ok" style="animation-name: l16;">  [subtitles] terminée en 14.7 s</text>
  <text x="24" y="372.5" class="line log" style="animation-name: l17;">10:18:46 INFO DEMOID00001 : etape render</text>
  <text x="24" y="391" class="line ok" style="animation-name: l18;">  [render] terminée en 189.5 s</text>
  <text x="24" y="409.5" class="line log" style="animation-name: l19;">10:21:55 INFO DEMOID00001 : etape qa</text>
  <text x="24" y="428" class="line ok" style="animation-name: l20;">  [qa] terminée en 195.8 s</text>
  <text x="24" y="446.5" class="line done" style="animation-name: l21;">DEMOID00001 : done</text>
  <text x="24" y="465" class="line ok" style="animation-name: l22;">  00..07 : pret (qa passed)</text>

