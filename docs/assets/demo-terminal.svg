    @keyframes l19 { 0%,65.6% {opacity:0;} 66.1% {opacity:1;} 95% {opacity:1;} 100% {opacity:0;} }
    @keyframes l20 { 0%,69.0% {opacity:0;} 69.5% {opacity:1;} 95% {opacity:1;} 100% {opacity:0;} }
