function series(seed, base, ratio, noise) {
  const r = rng(seed), out = [];
  for (let i = 0; i < 120; i++) {
    const wave = 1 + 0.25 * Math.sin(i / 3.2) + (i > 100 ? 0.15 : 0);
    const spike = (i === 112 || i === 97 || i === 70) ? 2.6 : 1;
    out.push(Math.max(0, Math.round(base * ratio * wave * spike * (1 - noise / 2 + r() * noise))));
  }

}

/* ================= Calculs ================= */
const S = { acct: "clips", period: 28, tab: "vue", metric: "views", demo: "normal", sort: { key: "date", dir: -1 }, q: "", open: null, scanning: false, step: 0 };
const acct = () => ACCOUNTS.find((a) => a.id === S.acct);
const eff = () => (acct().never ? "empty" : S.demo);

function totals(a, id, n) {
  const s = a.series[id], len = s.length;
  const cur = s.slice(len - n).reduce((x, y) => x + y, 0);
  const prev = s.slice(len - 2 * n, len - n).reduce((x, y) => x + y, 0);
  return { cur, prev, delta: prev ? ((cur - prev) / prev) * 100 : null };
}
/* Retention : part de spectateurs encore présents à t. Le temps moyen en est l'intégrale. */
function retention(p) {
  const tau = p.dur * 0.22, f = p.full, pts = [];
  for (let t = 0; t <= p.dur; t++) pts.push({ t, v: f + (100 - f) * Math.exp(-t / tau) });
  return pts;
}
const avgWatch = (p) => retention(p).reduce((s, q) => s + q.v / 100, 0) - 0.5;
const SOURCES = [["Pour toi", 0.74], ["Abonnés", 0.12], ["Profil", 0.06], ["Recherche", 0.04], ["Son", 0.03], ["Autre", 0.01]];

/* ================= Graphique SVG (courbe par jour, rétention) ================= */
function lineChart(el, cfg) {
  const W = Math.max(280, el.clientWidth), H = el.clientHeight || 260, L = 44, R = 12, T = 12, B = 26;
  const n = cfg.labels.length, all = cfg.series.flatMap((s) => s.values).filter((v) => v != null);
  const rawMax = cfg.max != null ? cfg.max : Math.max(1, ...all);
  const step = Math.pow(10, Math.floor(Math.log10(rawMax / 4))), nice = [1, 2, 2.5, 5, 10].map((k) => k * step).find((k) => rawMax / k <= 4) || step * 10;
  const top = cfg.max != null ? cfg.max : Math.ceil(rawMax / nice) * nice;
  const x = (i) => L + (n === 1 ? 0 : (i / (n - 1)) * (W - L - R)), y = (v) => T + (1 - v / top) * (H - T - B);
  let g = `<defs><linearGradient id="grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>`;
  for (let v = 0; v <= top + 1e-6; v += top / 4) g += `<line class="grid-l" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${cfg.fy(v)}</text>`;
  (cfg.gaps || []).forEach((i) => { g += `<rect class="gapband" x="${x(i) - (W - L - R) / (n - 1) / 2}" y="${T}" width="${(W - L - R) / (n - 1)}" height="${H - T - B}"/>`; });
  const every = Math.max(1, Math.ceil(n / (W < 500 ? 5 : 8)));
  cfg.labels.forEach((l, i) => { if ((i % every === 0 && (n - 1 - i >= every * 0.7 || i === 0)) || i === n - 1) g += `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === n - 1 ? "end" : "middle"}">${l}</text>`; });
  cfg.series.slice().reverse().forEach((s) => {
    let d = "", seg = [];
    const flush = () => { if (seg.length) { d += "M" + seg.map((i) => `${x(i).toFixed(1)} ${y(s.values[i]).toFixed(1)}`).join("L"); } seg = []; };
    s.values.forEach((v, i) => { if (v == null) flush(); else seg.push(i); }); flush();
    if (s.area) { const f = s.values.findIndex((v) => v != null); g += `<path class="ar" d="M${x(f)} ${H - B}L${s.values.map((v, i) => (v == null ? null : `${x(i).toFixed(1)} ${y(v).toFixed(1)}`)).filter(Boolean).join("L")}L${x(n - 1)} ${H - B}Z"/>`; }
    g += `<path class="ln ${s.cls || ""}" d="${d}"/>`;
  });
  g += `<line class="cur-l" id="cl" y1="${T}" y2="${H - B}" style="display:none"/><circle class="cur-d" id="cd" r="5" style="display:none"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(cfg.aria)}">${g}</svg><div class="tip" hidden></div>`;
  const svg = el.firstChild, tip = el.lastChild, cl = svg.querySelector("#cl"), cd = svg.querySelector("#cd");
  function show(ev) {
    const r = svg.getBoundingClientRect(), px = ((ev.clientX - r.left) / r.width) * W;
    const i = Math.min(n - 1, Math.max(0, Math.round(((px - L) / (W - L - R)) * (n - 1))));
    const v = cfg.series[0].values[i];
    cl.setAttribute("x1", x(i)); cl.setAttribute("x2", x(i)); cl.style.display = "";
    if (v != null) { cd.setAttribute("cx", x(i)); cd.setAttribute("cy", y(v)); cd.style.display = ""; } else cd.style.display = "none";
    tip.innerHTML = cfg.tip(i); tip.hidden = false;
    const tx = (x(i) / W) * r.width; tip.style.left = Math.min(r.width - 70, Math.max(70, tx)) + "px"; tip.style.top = (v != null ? (y(v) / H) * r.height - 12 : 40) + "px";
  }
  svg.addEventListener("pointermove", show); svg.addEventListener("pointerdown", show);
  svg.addEventListener("pointerleave", () => { cl.style.display = "none"; cd.style.display = "none"; tip.hidden = true; });
}

function renderOverview() {

function drawChart() {
  const el = $("#chart"); if (!el) return;

  const gapAt = (i) => i % 17 === 5 && i >= 60; // jours où aucun relevé n'est passé (démo)

const cmp = { date: (p) => p.date.getTime(), views: (p) => p.views, likes: (p) => p.likes, comments: (p) => p.comments, shares: (p) => p.shares, avg: (p) => avgWatch(p), full: (p) => p.full, cap: (p) => p.cap.toLowerCase() };
function sortedPosts() {
  const a = acct(), k = S.sort.key, d = S.sort.dir, q = S.q.trim().toLowerCase();
  return a.posts.filter((p) => !q || p.cap.toLowerCase().includes(q)).sort((x, y) => {
    if (x.processing !== y.processing && k !== "date") return x.processing ? 1 : -1; // en cours de traitement : toujours en bas sauf tri par date
    const u = cmp[k](x), v = cmp[k](y);
    return (u < v ? -1 : u > v ? 1 : 0) * d;
  });
}
const COLS = [["thumb", "", false], ["cap", "Légende", false], ["date", "Date", false], ["views", "Vues", true], ["likes", "J'aime", true], ["comments", "Commentaires", true], ["shares", "Partages", true], ["avg", "Temps moyen", true], ["full", "% vu en entier", true]];

function scanNow() {
  if (S.scanning) return;
  S.scanning = true; S.step = 0; render();
  const tick = setInterval(() => {
    S.step++;
    if (S.step >= 4) {
      clearInterval(tick); S.scanning = false;
      const a = acct(); a.scan = new Date(NOW.getTime()); a.scans++; a.never = false;
      if (S.demo === "empty" || S.demo === "scanning") S.demo = "normal";
      render(); toast("ok", "Relevé terminé", `${a.handle} : ${a.posts.length} publication${a.posts.length > 1 ? "s" : ""} et 5 indicateurs mis à jour.`);
    } else render();
  }, document.documentElement.classList.contains("shot") ? 50 : 900);
}

/* ================= Navigation, événements ================= */
const NAV = [
  { g: "Production" }, ["tableau", "Tableau de bord", "layout-dashboard"], ["videos", "Vidéos", "film"], ["revue", "Revue", "sparkles"], ["clips", "Clips", "clapperboard"], ["publication", "Publication", "send"],
  { g: "Configuration" }, ["chaines", "Chaînes", "tv"], ["stats", "Statistiques", "chart-column"], ["reglages", "Réglages", "settings"],
];
$("#nav").innerHTML = NAV.map((n) => n.g ? `<div class="nav-group">${n.g}</div>` : `<a href="${n[0] === "stats" ? "#/vue" : "../maquette-web-v2/index.html#/" + n[0]}" class="${n[0] === "stats" ? "active" : ""}"${n[0] === "stats" ? ' aria-current="page"' : ""}>${icon(n[2])}${n[1]}</a>`).join("");
$("#tabbar").innerHTML = [["tableau", "Tableau", "layout-dashboard"], ["videos", "Vidéos", "film"], ["revue", "Revue", "sparkles"], ["clips", "Clips", "clapperboard"], ["publication", "Publication", "send"]]
  .map(([k, l, ic]) => `<a href="../maquette-web-v2/index.html#/${k}">${icon(ic, "i-lg")}${l}</a>`).join("");
$("#btn-menu").innerHTML = icon("menu");
function setTheme(t) {
  document.documentElement.dataset.theme = t; $("#btn-theme").innerHTML = icon(t === "light" ? "moon" : "sun");
  $('meta[name="theme-color"]').content = t === "light" ? "#f4f2ec" : "#0e0e0c";
  try { localStorage.setItem("clipper-maquette-theme", t); } catch (e) { /* stockage indisponible */ }
}
setTheme(document.documentElement.dataset.theme || "dark");
$("#btn-theme").addEventListener("click", () => { setTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light"); if (S.tab === "vue") drawChart(); });
$("#btn-menu").addEventListener("click", () => { $("#sidebar").classList.toggle("open"); });
document.addEventListener("click", (e) => { if (!e.target.closest("#sidebar, #btn-menu")) $("#sidebar").classList.remove("open"); });

$("#sel-acct").addEventListener("change", (e) => { S.acct = e.target.value; S.q = ""; render(); });
$("#seg-period").addEventListener("click", (e) => { const b = e.target.closest("button[data-p]"); if (b) { S.period = +b.dataset.p; render(); } });
$("#seg-demo").addEventListener("click", (e) => { const b = e.target.closest("button[data-d]"); if (b) { S.demo = b.dataset.d; render(); } });
$("#btn-scan").addEventListener("click", scanNow);
$("#tabs").addEventListener("click", (e) => { const b = e.target.closest("button[data-t]"); if (b) { S.tab = b.dataset.t; render(); } });
$("#tabs").addEventListener("keydown", (e) => { if (e.key === "ArrowRight" || e.key === "ArrowLeft") { S.tab = S.tab === "vue" ? "publications" : "vue"; render(); $("#tab-" + S.tab).focus(); } });
$("#pane").addEventListener("click", (e) => {
  const m = e.target.closest("button[data-m]"); if (m) { S.metric = m.dataset.m; render(); return; }
  if (e.target.closest("[data-act=scan]")) { scanNow(); return; }
  const s = e.target.closest("button[data-s]");
  if (s) { const k = s.dataset.s; S.sort = S.sort.key === k ? { key: k, dir: -S.sort.dir } : { key: k, dir: k === "cap" ? 1 : -1 }; render(); const nb = $(`button[data-s="${k}"]`); if (nb) nb.focus(); return; }
  if (e.target.closest("#dir-m")) { S.sort.dir *= -1; render(); return; }
  const tr = e.target.closest("tr[data-id]"); if (tr) openPost(tr.dataset.id);
});
$("#pane").addEventListener("keydown", (e) => { const tr = e.target.closest("tr[data-id]"); if (tr && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openPost(tr.dataset.id); } });
$("#pane").addEventListener("change", (e) => { if (e.target.id === "sort-m") { S.sort = { key: e.target.value, dir: e.target.value === "cap" ? 1 : -1 }; render(); } });
$("#pane").addEventListener("input", (e) => { if (e.target.id === "q") { S.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $("#q"); q.focus(); q.setSelectionRange(pos, pos); } });
$("#overlay").addEventListener("click", closePost);
$("#drawer").addEventListener("click", (e) => { if (e.target.closest("#dr-close")) closePost(); });
document.addEventListener("keydown", (e) => {
  if (S.open && e.key === "Escape") { closePost(); return; }
  if (S.open && e.key === "Tab") { // le focus reste dans le panneau
    const f = [...$("#drawer").querySelectorAll("a[href],button")]; if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { placeThumbs(); if (S.tab === "vue") drawChart(); const c = $("#chart-ret"); if (c && S.open) drawRet(acct().posts.find((x) => x.id === S.open), c); }, 120); });

/* Hash initial : #/vue, #/publications, #/publications/<id> ; ?demo=empty|scanning|noposts, ?acct=tests */
(function init() {
  const h = location.hash.replace(/^#\/?/, "").split("?")[0].split("/");
  if (h[0] === "publications") S.tab = "publications";
  const dq = location.hash.match(/[?&]demo=(\w+)/), aq = location.hash.match(/[?&]acct=(\w+)/), pq = location.hash.match(/[?&]period=(\d+)/);
  if (dq) S.demo = dq[1]; if (aq && ACCOUNTS.some((a) => a.id === aq[1])) S.acct = aq[1]; if (pq && [7, 28, 60].includes(+pq[1])) S.period = +pq[1];
  render();
  if (h[0] === "publications" && h[1]) openPost(h[1]);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { placeThumbs(); });
})();
</script>
