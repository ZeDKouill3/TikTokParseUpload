[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipper"
version = "0.1.0"
description = "Clips verticaux sous-titres pour TikTok a partir de videos longues YouTube et VOD Twitch"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp",
    "yt-dlp-ejs",
    "anthropic",
    "numpy",
    "scenedetect",
    "faster-whisper",
    "mediapipe",
    "fastapi",
    "uvicorn",
    # render : titre d'ecran letterbox rasterise (Pillow) et couverture des polices (fonttools).
    "pillow",
    "fonttools",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "httpx",
]

[project.scripts]
clipper = "clipper.__main__:main"

[tool.setuptools.packages.find]
include = ["clipper", "clipper.*"]

[tool.setuptools.package-data]
clipper = ["assets/**/*", "web/static/**/*"]

[tool.uv]
# mediapipe impose opencv-contrib-python ; scenedetect demande opencv-python (meme
# module cv2, ecrase l'autre selon l'ordre d'install). On ecarte opencv-python pour
# garder un seul paquet OpenCV installe : opencv-contrib-python, sur-ensemble de
# opencv-python, satisfait cv2 pour scenedetect comme pour mediapipe.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[tool.pytest.ini_options]
testpaths = ["tests", "tools"]
