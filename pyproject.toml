[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipper"
version = "0.1.0"
description = "Pipeline de clips verticaux sous-titres a partir de videos YouTube longues"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp",
    "anthropic",
    "numpy",
    "scenedetect",
    "faster-whisper",
    "mediapipe",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "httpx",
]

[tool.setuptools.packages.find]
include = ["clipper", "clipper.*"]

[tool.setuptools.package-data]
clipper = ["assets/**/*"]

[tool.uv]
# mediapipe impose opencv-contrib-python ; scenedetect demande opencv-python (meme
# module cv2, ecrase l'autre selon l'ordre d'install). On ecarte opencv-python pour
# garder un seul paquet OpenCV installe : opencv-contrib-python, sur-ensemble de
# opencv-python, satisfait cv2 pour scenedetect comme pour mediapipe.
override-dependencies = ["opencv-python; sys_platform == 'never'"]
