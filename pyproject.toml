[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipper"
version = "0.1.0"
description = "Clips verticaux sous-titres pour TikTok a partir de videos longues YouTube et VOD Twitch"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp",
    "yt-dlp-ejs",
    "anthropic",
    "numpy",
    "scenedetect",
    "faster-whisper",
    "mediapipe",
    "fastapi",
    "uvicorn",
    # render : titre d'ecran letterbox rasterise (Pillow) et couverture des polices (fonttools).
    "pillow",
    "fonttools",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-xdist>=3",
    "httpx",
]

[project.scripts]
clipper = "clipper.__main__:main"

[tool.setuptools.packages.find]
include = ["clipper", "clipper.*"]

[tool.setuptools.package-data]
clipper = ["assets/**/*", "web/static/**/*"]

[tool.uv]
# mediapipe impose opencv-contrib-python ; scenedetect demande opencv-python (meme
# module cv2, ecrase l'autre selon l'ordre d'install). On ecarte opencv-python pour
# garder un seul paquet OpenCV installe : opencv-contrib-python, sur-ensemble de
# opencv-python, satisfait cv2 pour scenedetect comme pour mediapipe.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[tool.pytest.ini_options]
testpaths = ["tests", "tools"]
# Suite CPU-bound (ADR-fb9b) : chaque test est isole (tmp_path, llm.use_backend,
# FakeBackend), donc distribuable sur les coeurs sans etat partage. -n auto
# (= os.cpu_count(), 12 coeurs logiques sur ce PC) sursouscrit le CPU sur une
# machine partagee avec d'autres sessions agent actives (flaky observe sur
# les tests de concurrence reelle avant leur correctif, cf. TASK-42a46cb23f78).
# -n 6 (coeurs physiques) laisse une marge CPU/RAM pour le reste du PC
# partage, au prix d'un gain moindre que -n auto.
addopts = "-n 6"
