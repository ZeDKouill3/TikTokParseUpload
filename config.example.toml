# Copier ce fichier vers config.toml puis ajuster.

# review : aucun rendu final sans decision humaine enregistree.
# auto   : pipeline autonome, file d'attente sur echec transitoire,
#          le controle qualite (etape qa) remplace la revue humaine.
mode = "review"

# Racine des dossiers de travail par video (workspace/<video_id>/).
workspace_dir = "workspace"

# Racine des clips rendus.
output_dir = "output"

# Chaque etape du pipeline (module clipper/x.py) peut declarer son propre
# dict CONFIG_DEFAULTS pour documenter les cles qu'elle accepte. Une table
# [x] ici est validee contre ce dict : cle absente de CONFIG_DEFAULTS
# refusee, section sans module clipper.x ou sans CONFIG_DEFAULTS refusee.
# Voir CONFIG_DEFAULTS dans le module clipper.x concerne pour la liste des
# cles disponibles, par exemple :
#
# [llm]
# backend = "claude-cli"
#
# [reframe]
# format = "letterbox"    # letterbox (zoom fixe, defaut) | crop (option figee)
# letterbox_zoom = 1.3     # fenetre centrale de largeur source_w / zoom
# layout = "stream_auto"   # letterbox (defaut) | stream_auto (facecam detectee, SPEC-3a88)
# stream_variant = "split" # top (defaut, inchange) | split (SPEC-76dc, webcam haut/jeu bas)
#
# [captions]
# screen_title_allow_emoji = false   # SPEC-6a86 (defaut) : titre d'ecran sobre, sans emoji
#
# [tiktok]   # releves de statistiques (SPEC-47e2) : seulement quand on se sert de Clipper
# stats_stale_min = 60      # ecran Statistiques : releve a l'ouverture si le dernier a plus de N minutes (0 = jamais)
# stats_interval_h = 0      # releve periodique du worker toutes les N heures ; 0 = coupe (defaut), negatif refuse
# stats_scroll_rounds = 10  # limite de securite du defilement de la liste des posts (atteinte : releve arrete, journalise)
# stats_empty_wait_s = 8    # attente de la liste avant de conclure « aucun post » (compte neuf)

# [youtube]  # comptes YouTube (SPEC-5e50) : YouTube Studio dans un vrai Chrome, un seul compte pilote a la fois
# max_posts_per_day = 3      # plafond de publications par compte et par jour
# min_gap_minutes = 120      # ecart minimal entre deux publications d'un compte
# min_action_delay_s = 0.3   # pause humaine entre deux actions sur la page
# max_action_delay_s = 1
# action_timeout_s = 30      # attente d'un element de la page (adresse de chaine, bouton...)
# poll_interval_s = 1        # pas d'attente entre deux lectures de la page
# publish_mode = "immediate" # immediate | scheduled (programme cote YouTube, PC eteint ensuite)
# visibility = "public"      # public | unlisted | private (une video programmee est toujours publique)
# made_for_kids = false      # « conçue pour les enfants » : non par defaut (reponse obligatoire de Studio)
# upload_timeout_s = 600     # attente de la fin de l'envoi du mp4 (lien du Short, bouton final actif)
# publish_confirm_timeout_s = 120  # attente de la fenetre « Vidéo mise en ligne » apres le clic final
# schedule_max_days = 30     # programmation la plus lointaine acceptee ; au-dela Clipper garde la publication
# schedule_min_minutes = 15  # avance minimale d'une programmation
#
# Toute date ou heure saisie dans une page (TikTok comme YouTube) est en heure de Paris (Europe/Paris),
# quel que soit le fuseau du PC : le navigateur pilote est lance avec ce fuseau.
#
# [browser]
# pilot_wait_s = 300         # un seul compte pilote a la fois : attente du compte en cours avant d'echouer

# [journal]  # journal global de toutes les actions (TASK-8067), un fichier par jour sous logs/
# enabled = true            # desactive (tests isoles) : aucun handler, aucun dossier logs/
# dir = "logs"
# retention_days = 2        # purge au-dela de N jours, au demarrage et a chaque changement de jour
# level = "INFO"            # independant de la verbosite console (-v/-vv)
# exclude_paths = ["/static/", "/media/"]  # jamais journalises par le middleware web

# Reglages retenus apres le banc RTX 3050 4 Go (docs/benchmarks/rtx3050.md) :
# deja les valeurs par defaut de CONFIG_DEFAULTS, rappelees ici pour memoire,
# pas necessaire de les recopier dans un config.toml reel.
#
# [transcribe]
# model = "small"    # pic VRAM whisper mesure : 1,68 Go (marge large sur 4 Go)
#                    # ; large-v3-turbo banc a part (docs/benchmarks/whisper-modeles.md) :
#                    # meilleure qualite sur de la parole propre mais pic VRAM 3,29 Go
#                    # (marge insuffisante sur 4 Go) et resultat mitige sur le stream de
#                    # jeu (code-switching vers l'anglais) -> pas retenu par defaut, option
#                    # au cas par cas sur une video de parole propre seulement
# batch_size = 8     # BatchedInferencePipeline : ~4-5x plus rapide qu'en
#                    # sequentiel sur une video reelle, sans perte de mots
#                    # (docs/bench-whisper-vitesse.md)
